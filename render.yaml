services:
  - type: web
    name: pdf-qa
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_ACCESS_CODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SECURE_COOKIES
        value: "true"
